<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14243a">
<title>Budapest an einem Tag</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇭🇺</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --danube:#14243a; --danube-2:#20385a;
  --stone:#ecebe5; --paper:#f7f6f2; --ink:#1a1d22; --muted:#5d6470;
  --tram:#f2c230; --zsolnay:#2f6b4f; --tile:#b4532a;
  --line:rgba(20,36,58,.14); --card:#ffffff;
  --display:"Bricolage Grotesque", ui-rounded, system-ui, -apple-system, sans-serif;
  --body:"Source Sans 3", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stone:#0f1a2a; --paper:#0b1422; --ink:#eef0f3; --muted:#9aa6b6;
    --line:rgba(255,255,255,.12); --card:#13213a;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.app{display:flex;flex-direction:column;height:100%}

header{background:var(--danube);color:#fff;padding:14px 16px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header h1{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1;margin:0;letter-spacing:-.02em}
header p{margin:4px 0 0;font-size:.85rem;color:#b9c6d8}
.clock{font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--tram);font-variant-numeric:tabular-nums}

#map{height:42vh;min-height:240px;flex:none;background:var(--stone);position:relative;z-index:0}
.mapbar{position:absolute;right:10px;bottom:10px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapbar button{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:20px;display:grid;place-items:center;cursor:pointer}
.mapbar button.on{background:#1f7aff;color:#fff}
.toast{position:absolute;left:10px;right:64px;bottom:10px;z-index:500;background:var(--danube);color:#fff;padding:8px 12px;border-radius:10px;font-size:.85rem;display:none}

.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0 24px}
.progress{display:flex;align-items:center;gap:10px;padding:10px 16px 4px;font-size:.85rem;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--zsolnay);transition:width .3s}

.stop{display:grid;grid-template-columns:62px 1fr;padding:0 16px 0 0}
.time{font-family:var(--display);font-weight:700;font-size:1.05rem;text-align:right;padding:14px 12px 0 0;font-variant-numeric:tabular-nums;color:var(--muted)}
.body{border-left:3px solid var(--line);padding:12px 0 16px 16px;position:relative}
.body::before{content:"";position:absolute;left:-9px;top:18px;width:15px;height:15px;border-radius:50%;background:var(--c);border:3px solid var(--paper)}
.stop.now .time{color:var(--ink)}
.stop.now .body{border-left-color:var(--tram)}
.stop.done .body h2{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.body h2{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em}
.badge{display:inline-block;background:var(--tram);color:var(--danube);font-weight:600;font-size:.75rem;padding:1px 8px;border-radius:20px;margin-left:6px;vertical-align:2px}
.body p{margin:0 0 8px;color:var(--muted);font-size:.95rem;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 11px;font:inherit;font-size:.85rem;cursor:pointer}
.chip:active{background:var(--stone)}
.actions{display:flex;gap:8px}
.actions button,.actions a{font:inherit;font-size:.88rem;font-weight:600;border-radius:10px;padding:8px 12px;text-decoration:none;border:0;cursor:pointer}
.go{background:var(--danube);color:#fff}
.chk{background:var(--stone);color:var(--ink)}
.stop.done .chk{background:var(--zsolnay);color:#fff}
.transit{margin-left:62px;padding:2px 0 2px 19px;border-left:3px dashed var(--line);font-size:.82rem;color:var(--muted)}
.note{margin:16px;padding:14px;border-radius:12px;background:var(--stone);font-size:.92rem}
.note b{font-family:var(--display)}
button:focus-visible,a:focus-visible{outline:3px solid var(--tram);outline-offset:2px}

.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:#fff;font:700 12px/1 var(--display)}
.sub{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.me{width:18px;height:18px;border-radius:50%;background:#1f7aff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,122,255,.25)}
.leaflet-popup-content{font-family:var(--body);font-size:.9rem;margin:10px 12px}
.leaflet-popup-content b{font-family:var(--display)}
@media (min-width:860px){
  .app{display:grid;grid-template-columns:1fr 420px;grid-template-rows:auto 1fr}
  header{grid-column:1/-1}
  #map{height:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Budapest an einem Tag</h1>
      <p id="sub">9 Etappen, Pest und Buda</p>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <div id="map">
    <div class="toast" id="toast"></div>
    <div class="mapbar">
      <button id="locBtn" aria-label="Meinen Standort anzeigen">📍</button>
      <button id="layerBtn" aria-label="Zur Strassenkarte wechseln">🗺️</button>
      <button id="fitBtn" aria-label="Ganze Route zeigen">⤢</button>
    </div>
  </div>
  <div class="list" id="list">
    <div class="progress"><span id="progTxt">0 von 9 erledigt</span><div class="bar"><i id="progBar"></i></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const PLAN = [
 {t:"08:00",end:"09:00",title:"Parlament",c:"#14243a",
  text:"Start am Kossuth-Lajos-Platz. Parlament von außen anschauen, dann zu Fuss weiter Richtung Szabadság tér.",
  places:[["Parlament / Kossuth tér",47.5070,19.0457]]},
 {t:"09:00",end:"10:00",title:"St.-Stephans-Basilika",c:"#b4532a",
  text:"Szabadság tér, Basilika und die Staatsoper von außen. Bei der Oper beginnt die Andrássy út.",
  places:[["Szabadság tér",47.5040,19.0503],["St.-Stephans-Basilika",47.5009,19.0539],["Ungarische Staatsoper",47.5027,19.0584],["Andrássy út (Start)",47.5035,19.0598]]},
 {t:"10:00",end:"12:15",title:"Andrássy út bis Heldenplatz",c:"#d17a22",
  text:"Die ganze Andrássy út zu Fuss hoch (ca. 2,5 km, 40 Min.). Dann Heldenplatz, Museum der Bildenden Künste, Kunsthalle, Burg Vajdahunyad, Stadtwäldchen und House of Music.",
  places:[["Andrássy út / Oktogon",47.5056,19.0636],["Heldenplatz",47.5149,19.0779],["Museum der Bildenden Künste",47.5161,19.0763],["Kunsthalle",47.5141,19.0795],["Burg Vajdahunyad",47.5153,19.0843],["Stadtwäldchen (Városliget)",47.5168,19.0810],["House of Music",47.5181,19.0773]]},
 {t:"12:15",end:"13:15",title:"Váci utca und Vörösmarty tér",c:"#c9962b",
  text:"Vörösmarty tér, Kettenbrücke, Donaupromenade und durch die Váci utca Richtung Markthalle.",
  places:[["Vörösmarty tér",47.4963,19.0509],["Kettenbrücke (Pester Seite)",47.4993,19.0466],["Donaupromenade",47.4955,19.0475],["Váci utca",47.4920,19.0555]],
  before:"🚇 Metro M1 ab Hősök tere bis Vörösmarty tér (fährt unter der Andrássy út). Oder zu Fuss zurück, ca. 40 Min."},
 {t:"13:15",end:"14:15",title:"Große Markthalle",c:"#2f6b4f",
  text:"Mittagessen in der Markthalle, danach über die Freiheitsbrücke nach Buda.",
  places:[["Große Markthalle",47.4869,19.0586],["Freiheitsbrücke",47.4858,19.0540]]},
 {t:"14:15",end:"16:00",title:"Gellértberg und Zitadelle",c:"#6a4c93",
  text:"Aufstieg zur Zitadelle mit Aussicht und Fotos. Blick auf Donau, Parlament, Kettenbrücke, Burg und Freiheitsbrücke.",
  places:[["Freiheitsstatue / Zitadelle",47.4866,19.0468]],must:true},
 {t:"16:00",end:"16:30",title:"Várkert Bazár",c:"#3a7ca5",
  text:"Gartenanlagen, historische Gebäude und Blick auf die Donau.",
  places:[["Várkert Bazár",47.4950,19.0418]]},
 {t:"16:30",end:"19:00",title:"Budaer Burgviertel",c:"#9b2335",
  text:"Burg, Präsidentenpalast, historische Gassen, Matthiaskirche und Fischerbastei. Fischerbastei am besten zum Sonnenuntergang, mit dem Parlament im Hintergrund.",
  places:[["Budaer Burg",47.4961,19.0398],["Präsidentenpalast",47.4984,19.0389],["Historische Gassen (Úri utca)",47.5005,19.0337],["Matthiaskirche",47.5019,19.0342],["Fischerbastei",47.5024,19.0350]],must:true},
 {t:"19:00",end:"23:00",title:"Budapest bei Nacht",c:"#1f3f6e",
  text:"Vom Burgviertel zu Fuss runter und über die Kettenbrücke ans Pester Ufer. Kurz der Donaupromenade entlang, dann Richtung Parlament. Beleuchtetes Parlament, Kettenbrücke und Blick auf die Burg. Alternativ eine Schifffahrt.",
  places:[["Kettenbrücke bei Nacht",47.4990,19.0455],["Donaupromenade (Blick auf die Burg)",47.4960,19.0472],["Pester Ufer mit Parlamentsblick",47.5065,19.0440]]}
];

const $=s=>document.querySelector(s);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=store.get("bp-done")||{};
const toMin=s=>{const[a,b]=s.split(":").map(Number);return a*60+b};
function toast(msg,ms=3500){const el=$("#toast");el.textContent=msg;el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",ms)}

/* ---------- Map ---------- */
const dark=matchMedia("(prefers-color-scheme: dark)").matches;
const map=L.map("map",{zoomControl:false,attributionControl:true}).setView([47.500,19.050],14);
/* Base maps: satellite (default) and street map, with automatic fallback */
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/";
const sat=L.layerGroup([
  L.tileLayer(ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"© Esri, Maxar, Earthstar Geographics"}),
  L.tileLayer(ESRI+"Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,opacity:.7}),
  L.tileLayer(ESRI+"Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:19})
]);
const STREET=[
  [`https://{s}.basemaps.cartocdn.com/rastertiles/${dark?"dark_all":"voyager"}/{z}/{x}/{y}{r}.png`,{maxZoom:19,subdomains:"abcd",attribution:"© OpenStreetMap, © CARTO"}],
  [ESRI+"World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"© Esri, © OpenStreetMap"}],
  ["https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}]
];
let streetIdx=0,street=null,mode="sat";
function makeStreet(){
  let ok=0,err=0;
  const l=L.tileLayer(STREET[streetIdx][0],STREET[streetIdx][1])
    .on("tileload",()=>ok++)
    .on("tileerror",()=>{err++;if(ok===0&&err>=3&&streetIdx<STREET.length-1){streetIdx++;map.removeLayer(l);street=makeStreet();street.addTo(map);street.bringToBack()}});
  return l;
}
function setMode(m){
  mode=m;
  if(m==="sat"){if(street)map.removeLayer(street);sat.addTo(map)}
  else{map.removeLayer(sat);street=street||makeStreet();street.addTo(map)}
  $("#layerBtn").textContent=m==="sat"?"🗺️":"🛰️";
  $("#layerBtn").setAttribute("aria-label",m==="sat"?"Zur Strassenkarte wechseln":"Zur Satellitenansicht wechseln");
}

const markers={};
PLAN.forEach((s,i)=>{
  s.places.forEach((p,j)=>{
    const main=j===0;
    const icon=L.divIcon({className:"",html:main?`<div class="pin" style="--c:${s.c}"><span>${i+1}</span></div>`:`<div class="sub" style="--c:${s.c}"></div>`,
      iconSize:main?[28,28]:[12,12],iconAnchor:main?[14,28]:[6,6],popupAnchor:main?[0,-26]:[0,-6]});
    const m=L.marker([p[1],p[2]],{icon,zIndexOffset:main?1000:0}).addTo(map)
      .bindPopup(`<b>${p[0]}</b><br>${s.t} ${s.title}<br><a href="${navLink(p[1],p[2])}">Zu Fuss hin navigieren</a>`);
    markers[`${i}-${j}`]=m;
  });
});
function navLink(lat,lng){return `https://maps.apple.com/?daddr=${lat},${lng}&dirflg=w`}

/* Route: walking legs fetched from OSM foot router, metro legs dashed */
const legs=[];
let cur=[];
PLAN.forEach(s=>{
  if(s.before){legs.push({walk:true,pts:cur});legs.push({walk:false,pts:[cur[cur.length-1],[s.places[0][1],s.places[0][2]]]});cur=[]}
  s.places.forEach(p=>cur.push([p[1],p[2]]));
});
legs.push({walk:true,pts:cur});

const allPts=PLAN.flatMap(s=>s.places.map(p=>[p[1],p[2]]));
const bounds=L.latLngBounds(allPts);
map.fitBounds(bounds,{padding:[30,30]});

legs.forEach(async leg=>{
  if(!leg.walk){L.polyline(leg.pts,{color:"#ffffff",weight:4,dashArray:"2 10",lineCap:"round"}).addTo(map);return}
  const fallback=()=>L.polyline(leg.pts,{color:"#f2c230",weight:4,opacity:.9,dashArray:"8 6"}).addTo(map);
  try{
    const coords=leg.pts.map(p=>`${p[1]},${p[0]}`).join(";");
    const r=await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${coords}?overview=full&geometries=geojson`);
    const j=await r.json();
    if(!j.routes||!j.routes[0])throw 0;
    const line=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
    L.polyline(line,{color:"#14243a",weight:8,opacity:.6}).addTo(map);
    L.polyline(line,{color:"#f2c230",weight:4.5,opacity:1}).addTo(map);
  }catch(e){fallback()}
});

setMode("sat");
$("#layerBtn").onclick=()=>setMode(mode==="sat"?"street":"sat");
$("#fitBtn").onclick=()=>map.fitBounds(bounds,{padding:[30,30]});

/* Live location */
let watchId=null,meMarker=null,meCircle=null,follow=true;
$("#locBtn").onclick=()=>{
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;$("#locBtn").classList.remove("on");
    if(meMarker){map.removeLayer(meMarker);map.removeLayer(meCircle);meMarker=null}return}
  if(!("geolocation" in navigator)){toast("Dieses Gerät gibt keinen Standort frei.");return}
  $("#locBtn").classList.add("on");follow=true;toast("Suche Standort …",2000);
  watchId=navigator.geolocation.watchPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    if(!meMarker){
      meMarker=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:2000}).addTo(map);
      meCircle=L.circle(ll,{radius:pos.coords.accuracy,color:"#1f7aff",weight:1,fillOpacity:.08}).addTo(map);
    }else{meMarker.setLatLng(ll);meCircle.setLatLng(ll).setRadius(pos.coords.accuracy)}
    if(follow){map.setView(ll,Math.max(map.getZoom(),16));follow=false}
  },err=>{
    $("#locBtn").classList.remove("on");watchId=null;
    toast(err.code===1?"Standort blockiert. In Safari öffnen und Ortungsdienste für Safari erlauben.":"Standort gerade nicht verfügbar. Nochmal tippen.",5000);
  },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
};

/* ---------- Timeline ---------- */
const list=$("#list");
PLAN.forEach((s,i)=>{
  if(s.before){const tr=document.createElement("div");tr.className="transit";tr.textContent=s.before;list.appendChild(tr)}
  const el=document.createElement("section");
  el.className="stop";el.id="s"+i;el.style.setProperty("--c",s.c);
  const p0=s.places[0];
  el.innerHTML=`<div class="time">${s.t}</div>
   <div class="body">
     <h2>${s.title}<span class="badge nowb" hidden>Jetzt</span>${s.must?'<span class="badge" style="background:var(--zsolnay);color:#fff">Unbedingt</span>':""}</h2>
     <p>${s.text}</p>
     <div class="chips">${s.places.map((p,j)=>`<button class="chip" data-k="${i}-${j}">${p[0]}</button>`).join("")}</div>
     <div class="actions">
       <a class="go" href="${navLink(p0[1],p0[2])}">Navigieren</a>
       <button class="chk" data-i="${i}">${done[i]?"Erledigt ✓":"Als erledigt markieren"}</button>
     </div>
   </div>`;
  if(done[i])el.classList.add("done");
  list.appendChild(el);
});
const note=document.createElement("div");note.className="note";
note.innerHTML="<b>Wenn die Zeit knapp wird:</b> zuerst Váci utca oder Stadtwäldchen kürzen. Zitadelle und Fischerbastei behalten.";
list.appendChild(note);

list.addEventListener("click",e=>{
  const chip=e.target.closest(".chip");
  if(chip){const m=markers[chip.dataset.k];map.flyTo(m.getLatLng(),17,{duration:.8});m.openPopup();
    document.getElementById("map").scrollIntoView({behavior:"smooth",block:"start"});return}
  const chk=e.target.closest(".chk");
  if(chk){const i=chk.dataset.i;done[i]=!done[i];store.set("bp-done",done);
    const st=document.getElementById("s"+i);st.classList.toggle("done",!!done[i]);
    chk.textContent=done[i]?"Erledigt ✓":"Als erledigt markieren";updateProgress()}
});

function updateProgress(){
  const n=Object.values(done).filter(Boolean).length;
  $("#progTxt").textContent=`${n} von ${PLAN.length} erledigt`;
  $("#progBar").style.width=(n/PLAN.length*100)+"%";
}
function tick(){
  const d=new Date(),hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0");
  $("#clock").textContent=`${hh}:${mm}`;
  const now=d.getHours()*60+d.getMinutes();
  let active=-1;
  PLAN.forEach((s,i)=>{const on=now>=toMin(s.t)&&now<toMin(s.end);if(on)active=i;
    const el=document.getElementById("s"+i);el.classList.toggle("now",on);el.querySelector(".nowb").hidden=!on});
  const nxt=PLAN.find(s=>toMin(s.t)>now);
  $("#sub").textContent=active>=0?`Jetzt: ${PLAN[active].title}`:nxt?`Als Nächstes um ${nxt.t}: ${nxt.title}`:"Tag geschafft";
  return active;
}
updateProgress();
const a=tick();
if(a>=0)setTimeout(()=>document.getElementById("s"+a).scrollIntoView({block:"start"}),300);
setInterval(tick,30000);
</script>
</body>
</html>
